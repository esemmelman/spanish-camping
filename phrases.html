<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Large-print Spanish camping vocabulary and sentences with English translations.">
  <title>Phrases Quiz — Spanish &amp; English</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; background: #f5f3e9; color: #173a32; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, main, footer { width: min(1100px, 100%); margin: auto; padding: 32px 24px; }
    header { padding-top: 64px; }
    .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(58px, 9vw, 98px); margin: 16px 0 8px; }
    .intro { font-size: 27px; line-height: 1.5; }
    h2 { font-size: clamp(36px, 5.5vw, 54px); margin: 48px 0 24px; }
    .pair { background: #fffef8; padding: clamp(24px, 4vw, 44px); margin-bottom: 24px; border: 1px solid #d5ddd2; border-left: 7px solid #48755b; border-radius: 16px; }
    .pair p { font-size: clamp(36px, 5vw, 58px); line-height: 1.35; margin: 0; overflow-wrap: break-word; }
    .pair .es { font-weight: 700; }
    .pair .en { font-weight: 700; color: #46565f; margin-top: 20px; padding-top: 20px; border-top: 1px solid #dce2d9; }
    footer { font-size: 20px; line-height: 1.6; padding-bottom: 48px; }
    @media print { body { background: white; } .pair { break-inside: avoid; } header { padding-top: 0; } }
    .page-nav { width: min(1100px, 100%); margin: auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; }
    .page-nav a { flex: 1 1 200px; text-align: center; padding: 24px 16px; border: 3px solid #173a32; border-radius: 14px; font-size: clamp(32px, 5vw, 44px); font-weight: 700; text-decoration: none; color: #173a32; background: #fffef8; }
    .page-nav a[aria-current="page"], .page-nav a:hover { color: white; background: #173a32; }
    .page-nav a:focus-visible { outline: 4px solid #b06b13; outline-offset: 4px; }
      .answers { display: grid; gap: 18px; }
    .quiz-button, .answer { font: inherit; font-size: clamp(28px, 4vw, 44px); line-height: 1.35; font-weight: 700; border: 3px solid #173a32; border-radius: 12px; padding: 24px; cursor: pointer; background: #fffef8; color: #173a32; }
    .answer { text-align: left; width: 100%; }
    .answer:hover:enabled, .quiz-button:hover { background: #e0eadb; }
    .answer.correct { background: #d9edcf; border-color: #315d20; }
    .answer.incorrect { background: #fce1dc; border-color: #a32a19; }
    .answer:disabled { cursor: default; opacity: 1; }
    button:focus-visible { outline: 4px solid #b06b13; outline-offset: 4px; }
    #question { font-size: clamp(36px, 5vw, 58px); margin-top: 20px; }
    #feedback { font-size: clamp(36px, 5vw, 58px); line-height: 1.35; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav class="page-nav" aria-label="Textbook pages"><a href="index.html">Page 22</a><a href="page23.html">Page 23</a><a href="page24.html">Page 24</a><a href="phrases.html" aria-current="page">Phrases</a></nav>
  <header>
    <p class="eyebrow">Spanish → English · Practice</p>
    <h1>Phrases</h1>
    <p class="intro">Practice short phrase groups from within sentences. Choose the English translation. Each answer is scored immediately. Questions and answers are shuffled each time.</p>
  </header>
  <main>
    <p id="progress" class="intro"></p>
    <p id="score" class="intro" aria-live="polite"></p>
    <section class="pair" aria-labelledby="question">
      <h2 id="question" lang="es" tabindex="-1"></h2>
      <div id="answers" class="answers" aria-label="English translations"></div>
    </section>
    <p id="feedback" class="intro" role="status"></p>
    <button id="next" class="quiz-button" type="button" hidden>Next phrase</button>
    <button id="restart" class="quiz-button" type="button" hidden>Play again</button>
    <noscript><p class="intro">Enable JavaScript to use the phrases quiz.</p></noscript>
  </main>
  <footer>Choose the English translation for each Spanish phrase.</footer>
<script src="phrases-data.js"></script>
<script src="phrases.js"></script>
</body>
</html>
